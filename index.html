<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lazy Tiger Labs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="canonical" href="https://lazytigerlabs.com/" />
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6BN42Y7V72"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-6BN42Y7V72');
  </script>

  <style>
    @font-face {
      font-family: 'Fred';
      src: url('assets/Fred.ttf') format('truetype');
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
    }
    .card {
      text-align: center;
    }
    img {
      /* Grows to fill the space the three buttons don't use, so it is as big
         as it can be on any phone without ever creating a scroll. The
         subtracted 240px is the button stack + its margins. */
      width: auto;
      height: auto;
      max-width: min(55vw, 320px);
      max-height: calc(100vh - 240px);
      max-height: calc(100dvh - 240px);
      margin-bottom: 24px;
      border-radius: 12px;
    }
    a {
      display: block;
      margin: 12px 0;
      padding: 14px;
      border-radius: 8px;
      background: #ff7700;
      color: #000;
      text-decoration: none;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-weight: 600;
      font-family: 'Fred', sans-serif;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/logo.jpg" alt="Lazy Tiger Labs logo" />
    <a id="surge" href="https://apps.apple.com/app/id6753192168">Play Surge!</a>
    <a href="mailto:hello@lazytigerlabs.com">Contact Us</a>
    <a href="/privacy.html">Privacy Policy</a>
  </div>

  <!-- Sends each visitor to the right store, tagged as website/homepage traffic.
       Per-game link pages live under /surge/<account>; this is the hub button. -->
  <script>
    var SURGE = {
      pt:      '127925134',
      ios:     'https://apps.apple.com/app/id6753192168',
      android: 'https://play.google.com/store/apps/details?id=com.lazytigerlabs.surge'
    };
    var campaign = 'surge-website-homepage';
    var ua = navigator.userAgent || '';
    var device, destination;

    if (/iPhone|iPad|iPod|Macintosh/i.test(ua)) {
      // iPadOS 13+ reports itself as Macintosh; same App Store URL works for both.
      device = /Macintosh/i.test(ua) ? 'macos' : 'ios';
      destination = SURGE.ios + '?pt=' + SURGE.pt + '&ct=' + encodeURIComponent(campaign) + '&mt=8';
    } else {
      // Android and desktop both go to Play — its referrer survives a
      // web-initiated install, so desktop clicks stay attributable.
      device = /Android/i.test(ua) ? 'android' : 'desktop';
      var referrer = 'utm_source=website&utm_medium=web&utm_campaign=' + campaign;
      destination = SURGE.android + '&referrer=' + encodeURIComponent(referrer);
    }

    var link = document.getElementById('surge');
    link.href = destination;
    link.addEventListener('click', function () {
      gtag('event', 'app_link_click', {
        game:            'surge',
        social_platform: 'website',
        account:         'homepage',
        device_type:     device,
        campaign:        campaign
      });
    });
  </script>
</body>
</html>
