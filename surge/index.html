<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Surge</title>
  <script>
    (function () {
      var ua = navigator.userAgent || navigator.vendor || window.opera;

      if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
        window.location.replace("https://apps.apple.com/app/id6753192168");
        return;
      }

      if (/android/i.test(ua)) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.lazytigerlabs.surge");
        return;
      }

      // Desktop/unknown — fall back to homepage
      window.location.replace("https://lazytigerlabs.com");
    })();
  </script>
</head>
<body></body>
</html>
