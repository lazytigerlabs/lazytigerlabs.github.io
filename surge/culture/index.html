<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Get Surge</title>

  <!-- ─── EDIT THIS CONFIG FOR EACH ACCOUNT ─────────────────────────────────
    game:     short name of the game (e.g. "surge", "game2")
    platform: social platform this link lives on (e.g. "tiktok", "youtube", "instagram")
    account:  your account handle or a label (e.g. "@lazytigerlabs", "main")
    medium:   utm_medium for the Play Store referrer (e.g. "social", "app")
    pt:       App Store Connect provider token (same for every app on the team)
    ios:      App Store URL for this game
    android:  Play Store URL for this game
  ─────────────────────────────────────────────────────────────────────────── -->
  <script>
    var CONFIG = {
      game:     'surge',
      platform: 'youtube',
      account:  'culture',
      medium:   'social',
      pt:       '127925134',
      ios:      'https://apps.apple.com/app/id6753192168',
      android:  'https://play.google.com/store/apps/details?id=com.lazytigerlabs.surge'
    };

    var GA_ID = 'G-6BN42Y7V72';
  </script>

  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6BN42Y7V72"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', GA_ID, { send_page_view: false });
  </script>

  <style>
    @font-face {
      font-family: 'Fred';
      src: url('/assets/Fred.ttf') format('truetype');
      font-display: swap;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #0f0f0f;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .logo {
      width: 40vw;
      max-width: 220px;
      min-width: 120px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .status {
      margin: 0 0 20px;
      font-size: 1.05rem;
      color: #bbb;
    }
    .btn {
      display: block;
      margin: 0 auto 16px;
      padding: 14px 28px;
      border-radius: 8px;
      background: #ff7700;
      color: #000;
      text-decoration: none;
      font-size: clamp(1rem, 2.5vw, 1.4rem);
      font-weight: 600;
      font-family: 'Fred', system-ui, sans-serif;
    }
    .home {
      color: #777;
      font-size: 0.9rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/logo.jpg" alt="Lazy Tiger Labs" />
    <p class="status" id="status"></p>
    <a class="btn" id="store" href="https://lazytigerlabs.com">Open the App Store</a>
    <a class="home" href="/">More from Lazy Tiger Labs</a>
  </div>

  <script>
    var ua = navigator.userAgent || '';
    var device, destination, label;

    // Campaign label used across both platforms: e.g. "surge-youtube-wealth"
    var campaign = CONFIG.game + '-' + CONFIG.platform + '-' + CONFIG.account;

    if (/iPhone|iPad|iPod/i.test(ua)) {
      device = 'ios';
      // ct = campaign token, shows in App Store Connect Analytics
      destination = CONFIG.ios + '?pt=' + CONFIG.pt + '&ct=' + encodeURIComponent(campaign) + '&mt=8';
      label = 'Open the App Store';
    } else if (/Android/i.test(ua)) {
      device = 'android';
      // referrer = UTM params, Firebase reads these on first_open
      var referrer = 'utm_source=' + CONFIG.platform
                   + '&utm_medium=' + CONFIG.medium
                   + '&utm_campaign=' + campaign;
      destination = CONFIG.android + '&referrer=' + encodeURIComponent(referrer);
      label = 'Get it on Google Play';
    } else if (/Macintosh/i.test(ua)) {
      // Same listing as iOS -- iPhone apps run as-is on Apple Silicon, so there
      // is no separate Mac URL to configure. Split out only to keep 'macos'
      // distinct from 'ios' in the GA4 device_type breakdown. Note an iPad in
      // Safari's desktop mode also reports as Macintosh and lands here; the
      // destination is right either way, only the label is approximate.
      device = 'macos';
      destination = CONFIG.ios + '?pt=' + CONFIG.pt + '&ct=' + encodeURIComponent(campaign) + '&mt=8';
      label = 'Open the App Store';
    } else {
      // Desktop: Play's web listing can push an install to a linked Android
      // device, and the referrer survives that — so it is the one fallback
      // that still attributes.
      device = 'desktop';
      // medium is hardcoded 'web' (not CONFIG.medium) so desktop-originated
      // installs stay separable from real Android ones in Play Console.
      var desktopReferrer = 'utm_source=' + CONFIG.platform
                          + '&utm_medium=web'
                          + '&utm_campaign=' + campaign;
      destination = CONFIG.android + '&referrer=' + encodeURIComponent(desktopReferrer);
      label = 'Get it on Google Play';
    }

    var store = document.getElementById('store');
    store.href = destination;
    store.textContent = label;

    // Static line, no timer: this tab is usually read *after* a successful
    // handoff, when the store has already opened, so it must not imply the
    // redirect failed. No store name here -- the button right below has it.
    var gameName = CONFIG.game.charAt(0).toUpperCase() + CONFIG.game.slice(1);
    document.getElementById('status').textContent = 'Tap below to play ' + gameName;

    gtag('event', 'app_link_click', {
      game:            CONFIG.game,
      social_platform: CONFIG.platform,
      account:         CONFIG.account,
      device_type:     device,
      campaign:        campaign,
      // beacon survives the page being torn down by the navigation, which is
      // what happens on Android/desktop. iOS cancels the navigation for the
      // universal-link handoff, so the page lives on and would have sent
      // anyway -- this is for the other platforms.
      transport_type:  'beacon'
    });

    // On mobile the store opens in its own app and this tab stays behind, so
    // leave a real page here instead of a spinner that never resolves.
    setTimeout(function () { window.location.href = destination; }, 400);
  </script>
</body>
</html>
